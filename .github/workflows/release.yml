name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  actions: write

# One run per tag: a duplicate push event waits for the first and then finds
# everything already published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # vX.Y.Z on main is a release. vX.Y.Z-rc.N on dev is a release candidate: a GitHub
      # pre-release and an npm "next" version for trying dev before it reaches main.
      # Client marketplaces follow main, so a candidate never reaches them.
      - name: Tag must name the release version (main) or a candidate of it (dev)
        id: kind
        run: |
          version="$(python -c "import json; print(json.load(open('index.json'))['plugin']['version'])")"
          if [ "$GITHUB_REF_NAME" = "v${version}" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$GITHUB_REF_NAME" | grep -Eq "^v${version//./\\.}-rc\.[0-9]+$"; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag $GITHUB_REF_NAME does not match release version v${version} or v${version}-rc.N"; exit 1
          fi

      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s plugins/agents-init/skills/agents-init/scripts -v
          python -m unittest discover -s plugins/agent-pack/tests -v
          python -m unittest discover -s plugins/opinion-manager/tests -v
          python -m unittest discover -s plugins/project-orchestrator/tests -v

      - name: Version gate against the previous release
        run: |
          previous="$(git describe --tags --abbrev=0 --exclude '*-rc.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then python scripts/release_meta.py --since "$previous"; else python scripts/release_meta.py; fi

      - name: Build the release tarball
        run: |
          tag="$GITHUB_REF_NAME"
          git archive --format=tar.gz --prefix="agenthelm-${tag}/" -o "agenthelm-${tag}.tar.gz" "$tag"
          sha="$(sha256sum "agenthelm-${tag}.tar.gz" | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/agenthelm-${tag}.tar.gz"
          printf '{"tag":"%s","commit":"%s","tarball_url":"%s","tarball_sha256":"%s"}\n' \
            "$tag" "$GITHUB_SHA" "$url" "$sha" > release.json

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release $GITHUB_REF_NAME already exists"; exit 0; fi
          prerelease=""
          if [ "${{ steps.kind.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "agenthelm-${GITHUB_REF_NAME}.tar.gz" release.json $prerelease \
            --title "$GITHUB_REF_NAME" --notes "版本与迁移说明见 CHANGELOG.md 与 release/migrations.json。"

      # Stage, not publish: a maintainer approves each version on npmjs.com with
      # 2FA. With the package's Trusted Publisher configured for this workflow,
      # npm authenticates through OIDC (provenance included) and NPM_TOKEN can be
      # deleted; until then a "Read and write (stage only)" NPM_TOKEN is used.
      - name: Stage @sakanano-moe/agenthelm when its version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/cli
        run: |
          channel="latest"
          if [ "${{ steps.kind.outputs.prerelease }}" = "true" ]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
            channel="next"
          fi
          version="$(node -p "require('./package.json').version")"
          if npm view "@sakanano-moe/agenthelm@${version}" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; using Trusted Publishing (OIDC)"; fi
          npm install -g npm@^11.15.0
          npm stage publish --tag "$channel"
          echo "::notice::@sakanano-moe/agenthelm@${version} is staged; approve it on npmjs.com with 2FA to publish."

      - name: Refresh the site so latest.json carries this release
        if: steps.kind.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
