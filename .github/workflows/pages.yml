name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp -R index.html index.json latest.json README.md CHANGELOG.md INSTALL.md MIGRATION.md llms.txt \
            archive plugins scripts release _site/
          mkdir -p _site/.claude-plugin
          cp .claude-plugin/marketplace.json _site/.claude-plugin/marketplace.json
          # Compatibility: existing Project Profiles reference the schema and
          # initializer at /skills/agents-init/ on the old site path.
          mkdir -p _site/skills
          cp -R plugins/agents-init/skills/agents-init _site/skills/agents-init
          cp .nojekyll _site/.nojekyll

      - name: Attach the latest release to latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/attach_release.py _site/latest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
